<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Revisión del banco · TIC A1/A2</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#162a3c;background:#f3f6f8;line-height:1.6}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:32px 24px 70px}header{border-bottom:2px solid #c6d5df;padding-bottom:22px}h1{font-size:clamp(1.8rem,4vw,2.6rem);margin:.3em 0}h2{font-size:1.05rem;margin:0}a{color:#075e78;text-underline-offset:3px}.eyebrow{font-weight:700;letter-spacing:.08em;color:#076477}.muted{color:#536577}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat{background:white;border:1px solid #d8e1e7;border-radius:12px;padding:16px}.stat strong{display:block;font-size:1.8rem;color:#075e78}.filters{display:flex;gap:16px;flex-wrap:wrap;background:#e7eef3;padding:18px;border-radius:12px}label{display:flex;flex-direction:column;gap:5px;font-weight:600}label.search{flex:1;min-width:230px}input,select,button{font:inherit;padding:9px 12px;border:1px solid #aebecb;border-radius:6px;background:white;color:inherit}input:focus,select:focus,button:focus{outline:3px solid #54bacb}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}article{background:white;border:1px solid #d8e1e7;border-radius:12px;padding:22px;margin:18px 0;overflow-wrap:anywhere}.badge{display:inline-block;padding:2px 9px;border-radius:5px;background:#e0f1eb;color:#14543d;font-size:.83rem;font-weight:700}.pending{background:#fff1cf;color:#75530b}.topics{font-size:.9rem;color:#50677b;margin:12px 0}.question{font-weight:650;font-size:1.08rem}li{padding:3px 0}.correct{color:#125b43;font-weight:650}.explanation{background:#f0f6f8;padding:14px;border-left:3px solid #188497}.sources{font-size:.9rem}details{border-top:1px solid #e0e7ec;margin-top:18px;padding-top:12px}summary{cursor:pointer;color:#075e78;font-weight:600}.paging{display:flex;justify-content:space-between;align-items:center;gap:15px}#results-count{margin-bottom:0}#error{color:#992e30}progress{width:100%;height:10px;accent-color:#117e82}@media(max-width:600px){main{padding:20px 14px}.stats{grid-template-columns:1fr 1fr}.filters label{width:100%}article{padding:16px}}
  </style>
  <script defer src="revision/vista.js?v=20261028-417"></script>
</head>
<body><main>
  <header><div class="eyebrow">ITIC · A1 / A2 DEL ESTADO</div><h1>Revisión del banco de preguntas</h1><p>Consulta los temas oficiales, las fuentes y las correcciones. La revisión está en curso.</p><a href="index.html">Abrir simulador</a></header>
  <section class="stats" aria-label="Progreso"><div class="stat"><strong id="total">—</strong>Preguntas totales</div><div class="stat"><strong id="worked">—</strong>Clasificadas</div><div class="stat"><strong id="verified">—</strong>Verificadas</div><div class="stat"><strong id="pending">—</strong>Con dudas abiertas</div></section>
  <progress id="progress" aria-label="Preguntas verificadas"></progress><p class="muted" id="progress-label">Cargando banco…</p>
  <section class="filters" aria-label="Filtros">
    <label class="search">Buscar por texto, etiqueta, tema o ID<input id="query" type="search" placeholder="Ej.: A2-I-7, contratación o 18"></label>
    <label>Mostrar<select id="status"><option value="trabajadas">Preguntas trabajadas</option><option value="corregida">Corregidas</option><option value="vigente">Vigentes verificadas</option><option value="historica">Históricas verificadas</option><option value="pendiente">Con dudas abiertas</option><option value="sin_revisar">Sin revisar</option><option value="todas">Todas</option></select></label>
    <label>Cuerpo asignado<select id="body"><option value="todos">A1 y A2</option><option>A1</option><option>A2</option></select></label>
  </section>
  <p id="error" role="alert"></p><p id="results-count" role="status"></p><section id="questions" aria-label="Preguntas"></section>
  <nav class="paging" aria-label="Páginas"><button id="previous">Anterior</button><span id="page"></span><button id="next">Siguiente</button></nav>
</main></body></html>
